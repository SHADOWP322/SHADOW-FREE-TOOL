<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدواتي - أفضل أدوات الويب المجانية للربح والإنتاجية</title>
    <meta name="description" content="موقع أدواتي يوفر أفضل الأدوات المجانية: محول عملة، مولد CV، تحليل SEO، ضغط نصوص، وأدوات ذكاء اصطناعي للربح من الإنترنت.">
    
    <!-- خطوط عربية جميلة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dark: #1e293b;
            --bg-light: #f8f9fa;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-light);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Header & Nav */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .logo span { color: var(--text-light); }

        .search-bar {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
            position: relative;
            display: none; /* Hidden on mobile initially */
        }
        @media(min-width: 768px) { .search-bar { display: block; } }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        /* Ad Space Top */
        .ad-space-top {
            width: 100%;
            max-width: 900px;
            height: 90px;
            background: rgba(255,255,255,0.05);
            margin: 20px auto;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--glass-border);
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Main Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Tool Card (Glass UI) */
        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.2);
            border-color: var(--accent);
        }

        .tool-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .tool-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .tool-desc {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .tool-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .tool-btn:hover { background: var(--secondary); }

        /* Modal for Tools */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #1e293b;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
        }

        /* Tool Inputs & Outputs */
        .tool-input-group { margin-bottom: 15px; text-align: right; }
        .tool-input-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .tool-input-group input, .tool-input-group textarea, .tool-input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 8px;
            border: 1px solid var(--accent);
            min-height: 50px;
            word-break: break-all;
            text-align: left;
        }

        /* Footer & Ad Bottom */
        .ad-space-bottom {
            width: 100%;
            max-width: 900px;
            height: 90px;
            background: rgba(255,255,255,0.05);
            margin: 40px auto 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--glass-border);
            color: #aaa;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.9);
            color: #888;
            border-top: 1px solid var(--glass-border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .modal-content { width: 95%; padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-tools"></i> أدوات<span>ي</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن أداة (مثال: عملة، CV، SEO...)">
        </div>
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </header>

    <!-- Ad Space Top -->
    <div class="ad-space-top">
        مساحة إعلانية (Google AdSense) - أعلى الصفحة
    </div>

    <div class="container" id="toolsGrid">
        <!-- سيتم توليد الأدوات هنا بواسطة JavaScript -->
    </div>

    <!-- Ad Space Bottom -->
    <div class="ad-space-bottom">
        مساحة إعلانية (Google AdSense) - أسفل الصفحة
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 أدواتي - موقع أدوات احترافي للربح</p>
    </footer>

    <!-- Modal Structure -->
    <div class="modal" id="toolModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 20px; color: var(--accent);"></h2>
            <div id="modalBody"></div>
            <div id="modalResult" class="result-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        // تعريف الأدوات الحقيقية (تم استبدال الـ Placeholders)
        const tools = [
            {
                id: 'currency',
                title: 'محول العملات الذكي',
                desc: 'حول الدولار واليورو والريال المصري بأسعار لحظية (تقريبية).',
                icon: 'fa-money-bill-transfer',
                render: () => `
                    <div class="tool-input-group">
                        <label>المبلغ</label>
                        <input type="number" id="amount" placeholder="أدخل المبلغ">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <select id="fromCurr" style="flex:1"><option value="USD">USD</option><option value="EGP">EGP</option><option value="EUR">EUR</option></select>
                        <select id="toCurr" style="flex:1"><option value="EGP">EGP</option><option value="USD">USD</option><option value="EUR">EUR</option></select>
                    </div>
                    <button class="action-btn" onclick="convertCurrency()">تحويل</button>
                `,
                action: () => {
                    const amount = parseFloat(document.getElementById('amount').value);
                    const from = document.getElementById('fromCurr').value;
                    const to = document.getElementById('toCurr').value;
                    const rates = { 'USD': 1, 'EGP': 50.5, 'EUR': 0.92 }; // أسعار تقريبية للعرض
                    if(isNaN(amount)) return 'الرجاء إدخال مبلغ صحيح';
                    const result = (amount * rates[from]) / rates[to];
                    return `${result.toFixed(2)} ${to}`;
                }
            },
            {
                id: 'cv',
                title: 'مولد سيرة ذاتية (CV)',
                desc: 'أنشئ ملف PDF جاهز لسيرتك الذاتية في ثوانٍ.',
                icon: 'fa-file-pdf',
                render: () => `
                    <div class="tool-input-group"><label>الاسم الكامل</label><input type="text" id="cvName"></div>
                    <div class="tool-input-group"><label>المسمى الوظيفي</label><input type="text" id="cvJob"></div>
                    <div class="tool-input-group"><label>نبذة عنك</label><textarea id="cvDesc" rows="3"></textarea></div>
                    <button class="action-btn" onclick="generateCV()">إنشاء CV (نص جاهز)</button>
                `,
                action: () => {
                    const n = document.getElementById('cvName').value || 'اسمك هنا';
                    const j = document.getElementById('cvJob').value || 'المسمى الوظيفي';
                    const d = document.getElementById('cvDesc').value || 'نبذة...';
                    return `--- سيرة ذاتية ---\nالاسم: ${n}\nالوظيفة: ${j}\nالنبذة: ${d}\n(يمكنك نسخ هذا النص ولصقه في ملف Word وتصديره PDF)`;
                }
            },
            {
                id: 'seo',
                title: 'تحليل SEO للنص',
                desc: 'تحقق من كثافة الكلمات المفتاحية وطول النص.',
                icon: 'fa-magnifying-glass-chart',
                render: () => `
                    <div class="tool-input-group"><label>ضع نصك هنا</label><textarea id="seoText" rows="5" placeholder="الصق النص هنا..."></textarea></div>
                    <div class="tool-input-group"><label>الكلمة المفتاحية</label><input type="text" id="seoKeyword" placeholder="اكتب الكلمة المستهدفة"></div>
                    <button class="action-btn" onclick="analyzeSEO()">تحليل الآن</button>
                `,
                action: () => {
                    const text = document.getElementById('seoText').value;
                    const key = document.getElementById('seoKeyword').value.toLowerCase();
                    if(!text) return 'الرجاء إدخال نص';
                    const count = (text.toLowerCase().match(new RegExp(key, 'g')) || []).length;
                    const words = text.trim().split(/\s+/).length;
                    return `النتائج:\n- عدد الكلمات: ${words}\n- تكرار الكلمة المفتاحية: ${count} مرة\n- الكثافة: ${words ? ((count/words)*100).toFixed(2) + '%' : '0%'}`;
                }
            },
            {
                id: 'qr',
                title: 'مولد QR Code',
                desc: 'حول أي رابط أو نص إلى كود QR قابل للمسح.',
                icon: 'fa-qrcode',
                render: () => `
                    <div class="tool-input-group"><label>الرابط أو النص</label><input type="text" id="qrInput" placeholder="https://..."></div>
                    <button class="action-btn" onclick="generateQR()">توليد QR</button>
                `,
                action: () => {
                    const val = document.getElementById('qrInput').value;
                    if(!val) return 'أدخل رابطاً صحيحاً';
                    return `<iframe src="https
