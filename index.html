<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أدواتي - أدوات الويب المجانية</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh}.header{background:rgba(15,23,42,.8);backdrop-filter:blur(10px);padding:1rem 5%;position:sticky;top:0;z-index:1000;border-bottom:1px solid rgba(255,255,255,.2);display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.8rem;font-weight:700;color:#4895ef}.logo span{color:#fff}.search-bar{flex:1;max-width:500px;margin:0 20px;display:none}.search-bar input{width:100%;padding:10px 15px;border-radius:25px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;outline:none}@media(min-width:768px){.search-bar{display:block}}.ad-space{width:100%;max-width:900px;height:90px;background:rgba(255,255,255,.05);margin:20px auto;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.2);color:#aaa}.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.tool-card{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:25px;text-align:center;transition:transform .3s,box-shadow .3s;cursor:pointer;position:relative;overflow:hidden}.tool-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(67,97,238,.2);border-color:#4895ef}.tool-icon{font-size:2.5rem;color:#4895ef;margin-bottom:15px}.tool-title{font-size:1.2rem;font-weight:600;margin-bottom:10px}.tool-desc{font-size:.9rem;color:#ccc;margin-bottom:15px;line-height:1.5}.tool-btn{background:#4361ee;color:#fff;border:none;padding:8px 20px;border-radius:20px;cursor:pointer;font-weight:600;transition:background .3s}.tool-btn:hover{background:#3f37c9}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(5px)}.modal-content{background:#1e293b;width:90%;max-width:600px;padding:30px;border-radius:20px;border:1px solid rgba(255,255,255,.2);position:relative;max-height:90vh;overflow-y:auto}.close-modal{position:absolute;top:15px;left:15px;font-size:1.5rem;color:#aaa;cursor:pointer}.tool-input-group{margin-bottom:15px;text-align:right}.tool-input-group label{display:block;margin-bottom:5px;font-weight:600}.tool-input-group input,.tool-input-group textarea,.tool-input-group select{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#0f172a;color:#fff;font-size:1rem}.action-btn{width:100%;padding:12px;background:#4895ef;color:#fff;border:none;border-radius:8px;font-size:1.1rem;cursor:pointer;margin-top:10px}.result-box{margin-top:20px;padding:15px;background:rgba(67,97,238,.1);border-radius:8px;border:1px solid #4895ef;min-height:50px;word-break:break-all;text-align:left}footer{text-align:center;padding:20px;background:rgba(15,23,42,.9);color:#888;border-top:1px solid rgba(255,255,255,.2)}</style></head><body><header><div class="logo"><i class="fas fa-tools"></i> أدوات<span>ي</span></div><div class="search-bar"><input type="text" id="searchInput" placeholder="ابحث عن أداة..."></div></header><div class="ad-space">مساحة إعلانية (أعلى الصفحة)</div><div class="container" id="toolsGrid"></div><div class="ad-space">مساحة إعلانية (أسفل الصفحة)</div><footer><p>جميع الحقوق محفوظة © 2026 أدواتي</p></footer><div class="modal" id="toolModal"><div class="modal-content"><span class="close-modal" onclick="closeModal()">&times;</span><h2 id="modalTitle" style="margin-bottom:20px;color:#4895ef"></h2><div id="modalBody"></div><div id="modalResult" class="result-box" style="display:none"></div></div></div><script>const tools=[{id:'currency',title:'محول العملات',desc:'حول الدولار واليورو والمصري',icon:'fa-money-bill-transfer',render:()=>`<div class="tool-input-group"><label>المبلغ</label><input type="number" id="amount" placeholder="أدخل المبلغ"></div><div style="display:flex;gap:10px"><select id="fromCurr" style="flex:1"><option value="USD">USD</option><option value="EGP">EGP</option><option value="EUR">EUR</option></select><select id="toCurr" style="flex:1"><option value="EGP">EGP</option><option value="USD">USD</option><option value="EUR">EUR</option></select></div><button class="action-btn" onclick="convertCurrency()">تحويل</button>`,action:()=>{const amount=parseFloat(document.getElementById('amount').value);const from=document.getElementById('fromCurr').value;const to=document.getElementById('toCurr').value;const rates={USD:1,EGP:50.5,EUR:0.92};if(isNaN(amount))return'أدخل مبلغ';const result=(amount*rates[from])/rates[to];return`${result.toFixed(2)} ${to}`}},{id:'cv',title:'مولد CV',desc:'أنشئ سيرة ذاتية PDF',icon:'fa-file-pdf',render:()=>`<div class="tool-input-group"><label>الاسم</label><input type="text" id="cvName"></div><div class="tool-input-group"><label>الوظيفة</label><input type="text" id="cvJob"></div><button class="action-btn" onclick="generateCV()">إنشاء</button>`,action:()=>`الاسم: ${document.getElementById('cvName').value}\nالوظيفة: ${document.getElementById('cvJob').value}\n(نسخ النص وحفظه كـ PDF)`},{id:'seo',title:'تحليل SEO',desc:'فحص كثافة الكلمات',icon:'fa-magnifying-glass-chart',render:()=>`<div class="tool-input-group"><label>النص</label><textarea id="seoText" rows="3"></textarea></div><div class="tool-input-group"><label>الكلمة المفتاحية</label><input type="text" id="seoKeyword"></div><button class="action-btn" onclick="analyzeSEO()">تحليل</button>`,action:()=>{const text=document.getElementById('seoText').value;const key=document.getElementById('seoKeyword').value.toLowerCase();if(!text)return'أدخل نص';const count=(text.toLowerCase().match(new RegExp(key,'g'))||[]).length;const words=text.trim().split(/\s+/).length;return`كلمات: ${words}, تكرار: ${count}, كثافة: ${words?((count/words)*100).toFixed(2)+'%':'0%'}`}},{id:'qr',title:'مولد QR',desc:'تحويل رابط لـ QR',icon:'fa-qrcode',render:()=>`<div class="tool-input-group"><label>الرابط</label><input type="text" id="qrInput"></div><button class="action-btn" onclick="generateQR()">توليد</button>`,action:()=>{const val=document.getElementById('qrInput').value;if(!val)return'أدخل رابط';return`<iframe src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(val)}" width="200" height="200"></iframe>`}},{id:'base64',title:'Base64 Encode/Decode',desc:'تشفير وفك تشفير',icon:'fa-shield-halved',render:()=>`<div class="tool-input-group"><label>النص</label><textarea id="base64Input" rows="2"></textarea></div><button class="action-btn" onclick="base64Action()">تشفير</button><button class="action-btn" style="background:#3f37c9;margin-top:5px" onclick="base64Decode()">فك تشفير</button>`,action:()=>`نتيجة التشفير: ${btoa(document.getElementById('base64Input').value)}`,action2:()=>`نتيجة فك التشفير: ${atob(document.getElementById('base64Input').value)}`}];const toolsGrid=document.getElementById('toolsGrid');tools.forEach(tool=>{const card=document.createElement('div');card.className='tool-card';card.innerHTML=`<div class="tool-icon"><i class="fas ${tool.icon}"></i></div><div class="tool-title">${tool.title}</div><div class="tool-desc">${tool.desc}</div><button class="tool-btn" onclick="openTool('${tool.id}')">فتح الأداة</button>`;toolsGrid.appendChild(card);});function openTool(id){const tool=tools.find(t=>t.id===id);if(!tool)return;document.getElementById('modalTitle').innerText=tool.title;document.getElementById('modalBody').innerHTML=tool.render();document.getElementById('modalResult').style.display='none';document.getElementById('toolModal').style.display='flex';if(tool.action2) document.querySelector('.action-btn:last-child').onclick=tool.action2;}function closeModal(){document.getElementById('toolModal').style.display='none';}function convertCurrency(){const res=tools.find(t=>t.id==='currency').action();document.getElementById('modalResult').innerText=res;document.getElementById('modalResult').style.display='block';}function generateCV(){const res=tools.find(t=>t.id==='cv').action();document.getElementById('modalResult').innerText=res;document.getElementById('modalResult').style.display='block';}function analyzeSEO(){const res=tools.find(t=>t.id==='seo').action();document.getElementById('modalResult').innerText=res;document.getElementById('modalResult').style.display='block';}function generateQR(){const res=tools.find(t=>t.id==='qr').action();document.getElementById('modalResult').innerHTML=res;document.getElementById('modalResult').style.display='block';}function base64Action(){const res=tools.find(t=>t.id==='base64').action();document.getElementById('modalResult').innerText=res;document.getElementById('modalResult').style.display='block';}function base64Decode(){const res=tools.find(t=>t.id==='base64').action2();document.getElementById('modalResult').innerText=res;document.getElementById('modalResult').style.display='block';}document.getElementById('searchInput').addEventListener('input',(e)=>{const val=e.target.value.toLowerCase();Array.from(toolsGrid.children).forEach(card=>{const title=card.querySelector('.tool-title').innerText.toLowerCase();card.style.display=title.includes(val)?'block':'none';});});</script></body></html>
