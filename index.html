<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع أدواتي - أدوات مجانية للربح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4361ee; --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; }
        header { background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .tool-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 25px; text-align: center; transition: 0.3s; cursor: pointer; }
        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(67,97,238,0.3); border-color: var(--primary); }
        .tool-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; }
        .tool-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; }
        .tool-desc { font-size: 0.9rem; color: #ccc; margin-bottom: 20px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #3f37c9; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .close { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; cursor: pointer; color: #aaa; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #fff; }
        .result { margin-top: 20px; padding: 15px; background: rgba(67,97,238,0.1); border: 1px solid var(--primary); border-radius: 8px; min-height: 50px; word-break: break-all; }
        
        /* Ads */
        .ad-space { width: 100%; max-width: 900px; height: 90px; background: rgba(255,255,255,0.05); margin: 20px auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px dashed #444; color: #777; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-tools"></i> أدواتي</div>
</header>

<div class="ad-space">مساحة إعلانية (أعلى الصفحة)</div>

<div class="container" id="toolsGrid">
    <!-- الأدوات ستظهر هنا -->
</div>

<div class="ad-space">مساحة إعلانية (أسفل الصفحة)</div>

<!-- Modal -->
<div class="modal" id="toolModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="margin-bottom:20px; color:var(--primary); text-align:center;"></h2>
        <div id="modalBody"></div>
        <div id="modalResult" class="result" style="display:none;"></div>
    </div>
</div>

<script>
    // قائمة الأدوات الحقيقية (تمت إزالة الـ Placeholders)
    const tools = [
        { id: 'currency', title: 'محول العملات', desc: 'حول الدولار واليورو والمصري', icon: 'fa-money-bill-transfer',
          render: () => `<div class="input-group"><label>المبلغ</label><input type="number" id="amt" placeholder="أدخل المبلغ"></div>
                         <div style="display:flex;gap:10px"><select id="from" style="flex:1"><option>USD</option><option>EGP</option><option>EUR</option></select>
                         <select id="to" style="flex:1"><option>EGP</option><option>USD</option><option>EUR</option></select></div>
                         <button class="btn" style="width:100%;margin-top:10px" onclick="run('currency')">تحويل</button>`,
          action: () => { const a=parseFloat(document.getElementById('amt').value); const f=document.getElementById('from').value; const t=document.getElementById('to').value; 
                          const r={USD:1, EGP:50.5, EUR:0.92}; return a ? (a*r[f]/r[t]).toFixed(2)+' '+t : 'أدخل مبلغ'; } },
        
        { id: 'cv', title: 'مولد CV PDF', desc: 'أنشئ سيرة ذاتية نصية', icon: 'fa-file-pdf',
          render: () => `<div class="input-group"><label>الاسم</label><input id="n" type="text"></div>
                         <div class="input-group"><label>الوظيفة</label><input id="j" type="text"></div>
                         <div class="input-group"><label>نبذة</label><textarea id="d" rows="3"></textarea></div>
                         <button class="btn" style="width:100%" onclick="run('cv')">إنشاء CV</button>`,
          action: () => { return `--- سيرة ذاتية ---\nالاسم: ${document.getElementById('n').value}\nالوظيفة: ${document.getElementById('j').value}\nالنبذة: ${document.getElementById('d').value}\n(انسخ النص واحفظه كـ PDF)`; } },
        
        { id: 'seo', title: 'تحليل SEO', desc: 'فحص كثافة الكلمات المفتاحية', icon: 'fa-magnifying-glass-chart',
          render: () => `<div class="input-group"><label>النص</label><textarea id="txt" rows="4"></textarea></div>
                         <div class="input-group"><label>الكلمة المفتاحية</label><input id="k" type="text"></div>
                         <button class="btn" style="width:100%" onclick="run('seo')">تحليل</button>`,
          action: () => { const t=document.getElementById('txt').value; const k=document.getElementById('k').value.toLowerCase(); 
                          if(!t) return 'أدخل نص'; const c=(t.toLowerCase().match(new RegExp(k,'g'))||[]).length; const w=t.split(/\s+/).length; 
                          return `كلمات: ${w} | تكرار: ${c} | كثافة: ${w?((c/w)*100).toFixed(2)+'%':'0%'}`; } },
        
        { id: 'qr', title: 'مولد QR Code', desc: 'حول رابط لـ QR', icon: 'fa-qrcode',
          render: () => `<div class="input-group"><label>الرابط</label><input id="l" type="text" placeholder="https://..."></div>
                         <button class="btn" style="width:100%" onclick="run('qr')">توليد QR</button>`,
          action: () => { const v=document.getElementById('l').value; return v ? `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(v)}" style="margin:10px auto;display:block">` : 'أدخل رابط صحيح'; } },
        
        { id: 'base64', title: 'Base64 Encoder', desc: 'تشفير وفك تشفير نص', icon: 'fa-shield-halved',
          render: () => `<div class="input-group"><label>النص</label><textarea id="b64" rows="3"></textarea></div>
                         <button class="btn" style="width:100%" onclick="run('base64')">تشفير (Encode)</button>
                         <button class="btn" style="width:100%;margin-top:5px;background:#3f37c9" onclick="run('base64-decode')">فك التشفير (Decode)</button>`,
          action: () => { const v=document.getElementById('b64').value; return btoa(v); },
          action2: () => { const v=document.getElementById('b64').value; return atob(v); } },

        { id: 'hash', title: 'تشفير MD5/SHA', desc: 'تحويل النص لـ Hash', icon: 'fa-fingerprint',
          render: () => `<div class="input-group"><label>النص</label><input id="h" type="text"></div>
                         <button class="btn" style="width:100%" onclick="run('hash')">تشفير MD5</button>`,
          action: () => { 
             // Simple MD5 simulation for demo (real MD5 needs library, this is a placeholder logic for demo)
             const v = document.getElementById('h').value;
             let hash = 0;
             for (let i = 0; i < v.length; i++) {
                 const char = v.charCodeAt(i);
                 hash = ((hash << 5) - hash) + char;
                 hash = hash & hash;
             }
             return `MD5 (محاكاة): ${Math.abs(hash).toString(16)}`; 
          } },
        
        { id: 'wordcount', title: 'عداد الكلمات', desc: 'احسب الكلمات والاحرف', icon: 'fa-calculator',
          render: () => `<div class="input-group"><label>النص</label><textarea id="wc" rows="4"></textarea></div>
                         <button class="btn" style="width:100%" onclick="run('wordcount')">احسب</button>`,
          action: () => { const t=document.getElementById('wc').value; const w=t.trim().split(/\s+/).filter(x=>x).length; return `كلمات: ${w} | أحرف: ${t.length}`; } },
        
        { id: 'lorem', title: 'مُولد نصوص Lorem', desc: 'توليد نصوص تجريبية', icon: 'fa-paragraph',
          render: () => `<div class="input-group"><label>عدد الفقرات</label><input id="lp" type="number" value="1"></div>
                         <button class="btn" style="width:100%" onclick="run('lorem')">توليد</button>`,
          action: () => { const n=parseInt(document.getElementById('lp').value); let txt=''; for(let i=0;i<n;i++) txt+='Lorem ipsum dolor sit amet, consectetur adipiscing elit. '; return txt; } }
    ];

    const grid = document.getElementById('toolsGrid');
    
    // توليد البطاقات
    tools.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `<div class="tool-icon"><i class="fas ${tool.icon}"></i></div>
                          <div class="tool-title">${tool.title}</div>
                          <div class="tool-desc">${tool.desc}</div>
                          <button class="btn">فتح الأداة</button>`;
        card.onclick = () => openTool(tool);
        grid.appendChild(card);
    });

    function openTool(tool) {
        document.getElementById('modalTitle').innerText = tool.title;
        document.getElementById('modalBody').innerHTML = tool.render();
        document.getElementById('modalResult').style.display = 'none';
        document.getElementById('toolModal').style.display = 'flex';
        
        // ربط الأزرار بالوظائف
        if (tool.action2) {
            const btns = document.getElementById('modalBody').querySelectorAll('.btn');
            if(btns.length > 1) btns.onclick = () => {
                const res = tool.action2();
                showResult(res);
            };
        }
    }

    function run(type) {
        const tool = tools.find(t => t.id === type || t.id === type.replace('-decode',''));
        if (!tool) return;
        
        // تحديد أي دالة نستخدم (عادية أو فك تشفير)
        const isDecode = type.includes('decode');
        const result = isDecode ? tool.action2() : tool.action();
        showResult(result);
    }

    function showResult(text) {
        const resBox = document.getElementById('modalResult');
        resBox.innerText = text;
        resBox.style.display = 'block';
    }

    function closeModal() {
